<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#2b7a4b"><title>나의 여행·등산 기록지</title>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:system-ui,'Malgun Gothic',sans-serif;background:#f4f6f8;color:#222}
.wrap{max-width:980px;margin:auto;padding:14px}.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 1px 4px #0002}
label{display:block;margin:10px 0 3px;font-size:13px;color:#555}
input,select,button{font:inherit;padding:9px;border:1px solid #bbb;border-radius:8px;width:100%;box-sizing:border-box}
button{background:#2b7a4b;color:#fff;border:0;cursor:pointer;width:auto;padding:9px 16px;margin:4px 4px 0 0}button.g{background:#666}
#map{height:480px;border-radius:12px;background:#dde}h1{margin:0;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{border-bottom:1px solid #ddd;padding:6px;text-align:left}
.hide{display:none!important}.ov{position:fixed;inset:0;background:#000d;z-index:2000;overflow:auto;padding:14px}
.ov .in{background:#fff;border-radius:12px;max-width:900px;margin:auto;padding:14px}
.gal{display:flex;flex-wrap:wrap;gap:8px}.gal div{width:120px;font-size:11px}.gal img,.gal video{width:120px;height:90px;object-fit:cover;border-radius:6px}.gal .off{opacity:.3}
#show{position:fixed;inset:0;background:#000;z-index:3000;display:flex;align-items:center;justify-content:center}#cv{max-width:100%;max-height:100%}
</style></head><body><div class="wrap">
<div id="setup" class="card"><h2>나의 여행 및 등산 기록지 <small style="font-size:12px;color:#888">v4</small></h2>
<label>목적(제목)</label><input id="title" value="속리산등반">
<label>일시 (출발일)</label><input id="date" type="date">
<label>동반자 (쉼표로 구분, 이름 개수 = 인원)</label><input id="mates" placeholder="구주연, ...">
<label>일정</label><select id="dur"><option>당일</option><option>1박</option><option>2박</option><option>3박</option><option>4박</option></select>
<label>출발</label><input id="dep" placeholder="메가커피수원대점 오전10시">
<label>숙박지</label><input id="stay" value="없음">
<label>표지(대표) 이미지</label><input id="cover" type="file" accept="image/*">
<label>슬라이드쇼 음악 (선택)</label><input id="music" type="file" accept="audio/*">
<label>① 여행 사진·영상 (갤러리 선택)</label><input id="files" type="file" accept="image/*,video/*" multiple>
<label>② 원본 파일로 선택 (위치정보 유지 · 파일/내 파일 → DCIM/Camera)</label><input id="files2" type="file" multiple>
<label>Google Maps API 키 (이 기기에만 저장됩니다)</label><input id="gk" type="password" placeholder="AIza...">
<button onclick="build()">기록 만들기</button></div>
<div id="main" class="hide">
<div class="card"><h1 id="h" onclick="play()"></h1><div id="sub" style="color:#555;margin-top:4px"></div>
<div style="margin-top:8px"><button onclick="play()">▶ 슬라이드쇼</button><button class="g" onclick="rec()">🎬 MP4로 저장</button><button class="g" onclick="location.reload()">처음으로</button></div><div id="msg" style="font-size:13px;color:#a60;margin-top:6px"></div></div>
<div id="map"></div><div id="nl" style="margin-top:8px"></div>
<div class="card" style="margin-top:14px"><h3>전체 일정표</h3><div style="overflow-x:auto"><table id="tb"></table></div></div></div></div>
<div id="ov" class="ov hide" onclick="if(event.target==this)this.classList.add('hide')"><div class="in" id="oin"></div></div>
<div id="show" class="hide"><canvas id="cv" width="1280" height="720"></canvas><div style="position:absolute;right:14px;top:8px;font-size:30px;color:#fff;cursor:pointer" onclick="stop()">✕</div></div>
<audio id="au" loop></audio>
<script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js"></script>
<script>
const W=1280,H=720,$=id=>document.getElementById(id),FF='"Gaegu","Nanum Pen Script","Malgun Gothic",cursive';
let items=[],places=[],map,mk=[],pl,coverUrl='',pick=null,tok=0,gA=null,routeCv=null,routeSig='';
const raf=()=>new Promise(r=>requestAnimationFrame(r)),sleep=ms=>new Promise(r=>setTimeout(r,ms));
$('date').valueAsDate=new Date();$('gk').value=localStorage.getItem('gmkey')||'';
const fmtT=t=>new Date(t).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false});
const fmtD=t=>new Date(t).toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'short'});
function dist(a,b){const R=6371000,r=Math.PI/180,dl=(b.lat-a.lat)*r,dn=(b.lng-a.lng)*r;const x=Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
async function vidGps(f){const rd=b=>new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);x.readAsBinaryString(b)});
 for(const b of [f.slice(0,3e6),f.slice(Math.max(0,f.size-3e6))]){const s=await rd(b);const m=s.match(/\xA9xyz[\s\S]{0,6}?([+-]\d+\.\d+)([+-]\d+\.\d+)/);if(m)return[+m[1],+m[2]]}return null}
function loadG(key){return new Promise((res,rej)=>{if(window.google&&google.maps)return res();
 window.gm_authFailure=()=>{$('msg').textContent='⚠ 구글 지도 키 오류: Maps JavaScript API 사용 설정과 키 제한(웹사이트 주소)을 확인하세요.'};
 const s=document.createElement('script');s.src=`https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(key)}&language=ko&region=KR&callback=__g`;window.__g=res;s.onerror=rej;document.head.appendChild(s)})}
async function build(){
 const key=$('gk').value.trim();if(key)localStorage.setItem('gmkey',key);
 const seen=new Set(),fs=[...$('files').files,...$('files2').files].filter(f=>{const k=f.name+f.size+f.lastModified;if(seen.has(k))return false;seen.add(k);return /^(image|video)\//.test(f.type)||/\.(jpe?g|png|heic|heif|webp|mp4|mov|3gp)$/i.test(f.name)});
 if(!fs.length){alert('사진을 선택하세요');return}
 $('setup').classList.add('hide');$('main').classList.remove('hide');$('msg').textContent='사진 정보 읽는 중...';
 if($('cover').files[0])coverUrl=URL.createObjectURL($('cover').files[0]);
 if($('music').files[0])$('au').src=URL.createObjectURL($('music').files[0]);
 if(key){try{await loadG(key);map=new google.maps.Map($('map'),{center:{lat:36.5,lng:127.8},zoom:7,gestureHandling:'greedy',streetViewControl:false});
  map.addListener('click',onPick)}catch(_){$('msg').textContent='구글 지도를 불러오지 못했습니다(인터넷/키 확인).'}}
 items=[];
 for(const f of fs){const v=f.type.startsWith('video')||/\.(mp4|mov|3gp)$/i.test(f.name),it={file:f,url:URL.createObjectURL(f),video:v,t:f.lastModified,keep:true};
  const m=f.name.match(/(20\d\d)(\d\d)(\d\d)[_-]?(\d\d)(\d\d)(\d\d)/);if(m)it.t=+new Date(m[1],m[2]-1,m[3],m[4],m[5],m[6]);
  if(!v){try{const g=await exifr.gps(f);if(g&&g.latitude!=null){it.lat=g.latitude;it.lng=g.longitude}}catch(_){}
   try{const e=await exifr.parse(f,['DateTimeOriginal','CreateDate','GPSAltitude']);if(e){const d=e.DateTimeOriginal||e.CreateDate;if(d)it.t=+new Date(d);if(e.GPSAltitude!=null)it.alt=e.GPSAltitude}}catch(_){}
   try{it.th=await createImageBitmap(f,{resizeWidth:100})}catch(_){}}
  else{try{const g=await vidGps(f);if(g){it.lat=g[0];it.lng=g[1]}}catch(_){}}
  items.push(it)}
 items.sort((a,b)=>a.t-b.t);places=[];let cur=null;
 for(const it of items){const gp=it.lat!=null,near=cur&&(gp?(cur.hasGps&&dist(cur,it)<400):(it.t-cur.last<5400000));
  if(!near){cur={lat:gp?it.lat:null,lng:gp?it.lng:null,items:[],name:gp?'장소':'위치 미상',ele:null,hasGps:gp};places.push(cur)}
  cur.items.push(it);it.place=cur;cur.last=it.t;if(gp&&!cur.hasGps){cur.hasGps=1;cur.lat=it.lat;cur.lng=it.lng}}
 places.forEach(p=>{const g=p.items.filter(x=>x.lat!=null);if(g.length){p.lat=g.reduce((s,x)=>s+x.lat,0)/g.length;p.lng=g.reduce((s,x)=>s+x.lng,0)/g.length}});
 render();hint();await names();hint()}
function hint(){const n=items.filter(x=>x.lat==null).length,g=items.length-n;
 $('msg').textContent=`위치정보 읽음 ${g}개 / 없음 ${n}개.`+(n?` 없는 파일은 시간순으로 묶었고 '위치 지정'으로 직접 지정할 수 있어요. 갤러리 선택은 위치를 지우니 '② 원본 파일로 선택'을 쓰세요.`:'')}
async function locate(p){
 try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&zoom=17&accept-language=ko&lat=${p.lat}&lon=${p.lng}`);const d=await r.json(),a=d.address||{};
  p.name=d.name||a.tourism||a.natural||a.leisure||a.amenity||a.road||a.suburb||(d.display_name||'').split(',')[0]||'장소'}catch(_){}
 try{const r=await fetch(`https://api.open-meteo.com/v1/elevation?latitude=${p.lat}&longitude=${p.lng}`);p.ele=Math.round((await r.json()).elevation[0])}catch(_){
  const al=p.items.map(i=>i.alt).filter(x=>x!=null);if(al.length)p.ele=Math.round(al.reduce((a,b)=>a+b)/al.length)}}
async function names(){for(const p of places){if(p.lat==null||p.done)continue;p.done=1;await locate(p);render();await sleep(1100)}}
const isMt=p=>p.ele!=null&&(p.ele>=150||/산|봉|岳|산장/.test(p.name));
function mkIcon(p,i){const im=p.items.filter(x=>!x.video&&x.keep),vd=p.items.filter(x=>x.video&&x.keep),ths=im.slice(0,3).map(x=>x.th).filter(Boolean),
 w=Math.max(150,ths.length*52+8),hh=isMt(p)?98:80,cv=document.createElement('canvas');cv.width=w;cv.height=hh+8;const c=cv.getContext('2d');
 c.fillStyle='#fff';c.strokeStyle='#2b7a4b';c.lineWidth=3;c.beginPath();c.roundRect(2,2,w-4,hh,10);c.fill();c.stroke();
 c.fillStyle='#222';c.font='bold 13px sans-serif';c.fillText(`${i+1}. 사진${im.length}·영상${vd.length}`,8,18);
 ths.forEach((b,k)=>{const s=Math.min(b.width,b.height);c.drawImage(b,(b.width-s)/2,(b.height-s)/2,s,s,8+k*52,24,48,48)});
 if(isMt(p)){c.fillStyle='#c62828';c.fillText(`⛰ 해발 ${p.ele}m`,8,90)}
 return{url:cv.toDataURL(),scaledSize:new google.maps.Size(cv.width,cv.height),anchor:new google.maps.Point(w/2,cv.height)}}
function render(){
 $('h').textContent='📖 '+$('title').value;const m=$('mates').value.split(/[,，、]+/).map(s=>s.trim()).filter(Boolean);
 $('sub').textContent=`${$('date').value} · ${$('dur').value} · 동반 ${m.length}명${m.length?'('+m.join(', ')+')':''} · 출발: ${$('dep').value} · 숙박: ${$('stay').value}`;
 const pts=places.filter(p=>p.lat!=null);
 if(map){mk.forEach(x=>x.setMap(null));mk=[];if(pl)pl.setMap(null);
  pl=new google.maps.Polyline({map,path:pts.map(p=>({lat:p.lat,lng:p.lng})),strokeColor:'#e53935',strokeWeight:4,strokeOpacity:.9});
  places.forEach((p,i)=>{if(p.lat==null)return;const x=new google.maps.Marker({position:{lat:p.lat,lng:p.lng},map,icon:mkIcon(p,i),title:p.name});x.addListener('click',()=>openPlace(i));mk.push(x)});
  if(pts.length&&!map._fit){map._fit=1;const b=new google.maps.LatLngBounds();pts.forEach(p=>b.extend({lat:p.lat,lng:p.lng}));map.fitBounds(b);google.maps.event.addListenerOnce(map,'idle',()=>map.getZoom()>16&&map.setZoom(16))}}
 $('nl').innerHTML=places.map((p,i)=>p.lat==null?`<button class="g" onclick="openPlace(${i})">${i+1}. ${p.name} (${p.items.length}개) · 위치 지정</button>`:'').join('');
 let h='<tr><th>날짜</th><th>시간</th><th>장소</th><th>해발</th><th>사진</th><th>영상</th></tr>';
 h+=`<tr><td>${fmtD(items[0].t)}</td><td>출발</td><td>${$('dep').value||'-'}</td><td></td><td></td><td></td></tr>`;
 places.forEach((p,i)=>{const k=p.items.filter(x=>x.keep);if(!k.length)return;
  h+=`<tr><td>${fmtD(k[0].t)}</td><td>${fmtT(k[0].t)}~${fmtT(k[k.length-1].t)}</td><td>${i+1}. ${p.name}</td><td>${isMt(p)?p.ele+'m':''}</td><td>${k.filter(x=>!x.video).length}</td><td>${k.filter(x=>x.video).length}</td></tr>`});
 const last=items[items.length-1];h+=`<tr><td>${fmtD(last.t)}</td><td>${fmtT(last.t)}</td><td>여행 종료/도착</td><td></td><td></td><td></td></tr>`;$('tb').innerHTML=h}
async function onPick(e){if(pick==null)return;const p=places[pick];pick=null;p.lat=e.latLng.lat();p.lng=e.latLng.lng();p.hasGps=1;p.done=1;
 p.items.forEach(x=>{x.lat=p.lat;x.lng=p.lng});$('msg').textContent='장소 확인 중...';await locate(p);render();hint()}
function openPlace(i){const p=places[i];
 let h=`<h3>${i+1}. ${p.name} ${isMt(p)?'⛰ 해발 '+p.ele+'m':''}</h3><button onclick="pickLoc(${i})">📍 지도에서 위치 지정</button><button class="g" onclick="ren(${i})">✏️ 이름 변경</button><div class="gal" style="margin-top:8px">`;
 p.items.forEach((x,j)=>{h+=`<div class="${x.keep?'':'off'}">${x.video?`<video src="${x.url}" controls></video>`:`<img loading="lazy" src="${x.url}">`}<br>${fmtT(x.t)}<br><label style="display:inline"><input type="checkbox" style="width:auto" ${x.keep?'checked':''} onchange="tog(${i},${j},this.checked)"> 사용</label>
  <br><select onchange="mv(${i},${j},this.value)">${places.map((q,k)=>`<option value="${k}" ${k==i?'selected':''}>${k+1}. ${q.name}</option>`).join('')}</select></div>`});
 $('oin').innerHTML=h+'</div><button onclick="$(\'ov\').classList.add(\'hide\')">닫기</button>';$('ov').classList.remove('hide')}
function pickLoc(i){pick=i;$('ov').classList.add('hide');$('msg').textContent='지도에서 이 장소의 위치를 탭하세요 (확대해서 정확히)';$('map').scrollIntoView()}
function ren(i){const n=prompt('장소 이름',places[i].name);if(n){places[i].name=n;places[i].done=1;render();openPlace(i)}}
function tog(i,j,v){places[i].items[j].keep=v;render();openPlace(i)}
function mv(i,j,k){const x=places[i].items.splice(j,1)[0];x.place=places[k];places[k].items.push(x);places[k].items.sort((a,b)=>a.t-b.t);render();openPlace(+k)}

/* ===== 슬라이드쇼 ===== */
function meta(){const k=items.filter(x=>x.keep),d=t=>{const o=new Date(t);return[o.getFullYear(),o.getMonth()+1,o.getDate()]},a=d(k[0]?k[0].t:Date.now()),b=d(k.length?k[k.length-1].t:Date.now()),z=n=>String(n).padStart(2,'0');
 return{title:$('title').value,range:a.join()==b.join()?`${a[0]}.${z(a[1])}.${z(a[2])}`:`${a[0]}.${z(a[1])}.${z(a[2])} ~ ${b[0]!=a[0]?b[0]+'.':''}${z(b[1])}.${z(b[2])}`,
  names:[...new Set(places.filter(p=>p.items.some(x=>x.keep)&&!/위치 미상|^장소$/.test(p.name)).map(p=>p.name))],mates:$('mates').value.split(/[,，、]+/).map(s=>s.trim()).filter(Boolean)}}
function buildSlides(){const m=meta(),kept=items.filter(x=>x.keep),cu=coverUrl||(kept.find(x=>!x.video)||{}).url,S=[{k:'cover',u:cu,dur:4000,m}];
 if(routeCv)S.push({k:'route',el:routeCv,dur:2900});
 places.forEach(p=>p.items.filter(x=>x.keep).forEach(x=>S.push({k:x.video?'video':'photo',v:x.video,u:x.url,cap:/위치 미상|^장소$/.test(p.name)?'':p.name,rot:(Math.random()-.5)*.04,dur:3500})));
 S.push({k:'end',u:cu,dur:8000,m},{k:'black',dur:700});return S}
async function makeRoute(){const pts=places.filter(p=>p.lat!=null);if(!pts.length){routeCv=null;return}
 const sig=pts.map(p=>p.lat.toFixed(4)+p.lng.toFixed(4)).join();if(routeCv&&routeSig==sig)return;
 const cv=document.createElement('canvas');cv.width=W;cv.height=H;const c=cv.getContext('2d'),key=localStorage.getItem('gmkey');let ok=0;
 if(key){try{let ll=pts.map(p=>p.lat.toFixed(5)+','+p.lng.toFixed(5));if(ll.length>80)ll=ll.filter((_,i)=>i%Math.ceil(ll.length/80)==0);
  let u=`https://maps.googleapis.com/maps/api/staticmap?size=640x360&scale=2&language=ko&region=KR&maptype=roadmap&key=${key}`;
  if(pts.length>1)u+=`&path=color:0xe53935ff|weight:5|${ll.join('|')}&markers=color:green|label:S|${ll[0]}&markers=color:red|label:E|${pts[pts.length-1].lat.toFixed(5)},${pts[pts.length-1].lng.toFixed(5)}`;
  else u+=`&center=${ll[0]}&zoom=13&markers=color:red|${ll[0]}`;
  const r=await fetch(u);if(!r.ok)throw 0;c.drawImage(await createImageBitmap(await r.blob()),0,0,W,H);ok=1}catch(_){}}
 if(!ok){c.fillStyle='#e3ebdd';c.fillRect(0,0,W,H);const la=pts.map(p=>p.lat),ln=pts.map(p=>p.lng),a=Math.min(...la),b=Math.max(...la),x0=Math.min(...ln),x1=Math.max(...ln),sc=Math.min(1000/((x1-x0)*Math.cos(a*Math.PI/180)||1),480/((b-a)||1)),
  P=p=>[W/2+(p.lng-(x0+x1)/2)*Math.cos(a*Math.PI/180)*sc,H/2-(p.lat-(a+b)/2)*sc];
  c.strokeStyle='#e53935';c.lineWidth=6;c.beginPath();pts.forEach((p,i)=>{const[x,y]=P(p);i?c.lineTo(x,y):c.moveTo(x,y)});c.stroke();
  pts.forEach((p,i)=>{const[x,y]=P(p);c.fillStyle='#1565c0';c.beginPath();c.arc(x,y,12,0,7);c.fill();c.fillStyle='#222';c.font=`700 30px ${FF}`;c.textAlign='left';c.fillText(p.name,x+16,y-10)})}
 c.fillStyle='#000a';c.fillRect(0,0,W,90);c.fillStyle='#fff';c.textAlign='center';c.font=`700 52px ${FF}`;c.fillText(`🗺 여행 경로 · ${pts.length}곳`,W/2,64);
 c.strokeStyle='#fff';c.lineWidth=10;c.strokeRect(5,5,W-10,H-10);routeCv=cv;routeSig=sig}
async function prep(){const m=meta();try{await Promise.race([document.fonts.load('700 40px Gaegu',m.title+m.range+m.names.join('')+m.mates.join('')+places.map(p=>p.name).join('')+'여행 경로 함께한 여행자 0123456789 →·~.:'),sleep(4000)])}catch(_){}await makeRoute()}
async function load(s){if(s.el||!s.u)return;
 if(s.v){const v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='auto';v.src=s.u;await Promise.race([new Promise(r=>{v.onloadeddata=r;v.onerror=r}),sleep(5000)]);s.el=v}
 else{const im=new Image();im.src=s.u;try{await im.decode()}catch(_){s.bad=1}s.el=im}}
function txt(c,t,x,y,sz,col,maxw){c.font=`700 ${sz}px ${FF}`;c.fillStyle=col||'#fff';c.textAlign='center';c.shadowColor='#000c';c.shadowBlur=8;
 let line='',yy=y;for(const w of t.split(' ')){const tt=line?line+' '+w:w;if(c.measureText(tt).width>(maxw||1100)&&line){c.fillText(line,x,yy);yy+=sz*1.25;line=w}else line=tt}c.fillText(line,x,yy);c.shadowBlur=0;return yy+sz*1.25}
function bleed(c,el,k){const w=el.naturalWidth||el.width,h=el.naturalHeight||el.height,r=Math.max(W/w,H/h)*(1+.05*k);c.drawImage(el,(W-w*r)/2,(H-h*r)/2,w*r,h*r)}
