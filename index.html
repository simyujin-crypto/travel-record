<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#2b7a4b"><title>나의 여행 기록 · 자동 여행영상</title>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:system-ui,'Malgun Gothic',sans-serif;background:#f4f6f8;color:#222}
.wrap{max-width:980px;margin:auto;padding:14px}.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 1px 4px #0002}
label{display:block;margin:10px 0 3px;font-size:13px;color:#555}
input,select,button{font:inherit;padding:9px;border:1px solid #bbb;border-radius:8px;width:100%;box-sizing:border-box}
button{background:#2b7a4b;color:#fff;border:0;cursor:pointer;width:auto;padding:9px 16px;margin:4px 4px 0 0}button.g{background:#666}
#map{height:520px;border-radius:12px;background:#dde}h1{margin:0;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{border-bottom:1px solid #ddd;padding:7px;text-align:left}
.hide{display:none!important}.ov{position:fixed;inset:0;background:#000d;z-index:2000;overflow:auto;padding:14px}
.ov .in{background:#fff;border-radius:12px;max-width:900px;margin:auto;padding:14px}
.gal{display:flex;flex-wrap:wrap;gap:8px}.gal div{width:120px;font-size:11px}.gal img,.gal video{width:120px;height:90px;object-fit:cover;border-radius:6px}.gal .off{opacity:.3}
#show{position:fixed;inset:0;background:#000;z-index:3000}#cv{position:absolute;left:0;top:0;width:100vw;height:100vh;width:100dvw;height:100dvh;object-fit:contain;background:#000}
#show.rot #cv{left:50%;top:50%;width:100vh;height:100vw;width:100dvh;height:100dvw;transform:translate(-50%,-50%) rotate(90deg)}
</style></head><body><div class="wrap">
<div id="setup" class="card"><h2>나의 여행 기록 · 자동 여행영상 <small style="font-size:12px;color:#888">v6</small></h2>
<label>📁 여행 폴더 선택 (PC · 여러 여행이 들어있는 상위 폴더도 가능)</label><input id="dir" type="file" webkitdirectory multiple onchange="scanDir()">
<select id="trip" class="hide" onchange="pickTrip()" style="margin-top:6px"></select>
<label>📱 폰에서는 사진·영상을 여러 개 선택 (폴더 안에서 전체 선택)</label><input id="files" type="file" accept="image/*,video/*" multiple>
<label>원본 파일로 선택 (위치정보 유지 · 파일/내 파일 → DCIM/Camera)</label><input id="files2" type="file" multiple>
<label>여행 제목 (폴더를 고르면 자동 입력)</label><input id="title" value="나의 여행">
<label>동반자 (쉼표로 구분, 선택)</label><input id="mates" placeholder="이름1, 이름2">
<label>출발지 (선택)</label><input id="dep" placeholder="예: 수원 · 오전 10시"><label>숙박지 (선택)</label><input id="stay" value="없음">
<label>표지(대표) 이미지 (선택, 없으면 첫 사진)</label><input id="cover" type="file" accept="image/*">
<label>슬라이드쇼 음악 (선택)</label><input id="music" type="file" accept="audio/*">
<label>Google Maps API 키 (이 기기에만 저장됩니다)</label><input id="gk" type="password" placeholder="AIza...">
<button onclick="build()">여행 기록 만들기</button></div>
<div id="main" class="hide">
<div class="card"><h1 id="h" onclick="play()"></h1><div id="sub" style="color:#555;margin-top:4px"></div>
<div style="margin-top:8px"><button onclick="play()">▶ 여행영상 재생</button><button class="g" onclick="fitAll()">🗺 경로 전체보기</button><button class="g" onclick="rec()">🎬 MP4로 저장</button><button class="g" onclick="location.reload()">처음으로</button></div><div id="msg" style="font-size:13px;color:#a60;margin-top:6px"></div></div>
<div id="dayb"></div><div id="map"></div><div id="nl" style="margin-top:8px"></div>
<div class="card" style="margin-top:14px"><h3>전체 일정표</h3><div style="overflow-x:auto"><table id="tb"></table></div></div></div></div>
<div id="ov" class="ov hide" onclick="if(event.target==this)this.classList.add('hide')"><div class="in" id="oin"></div></div>
<div id="show" class="hide"><canvas id="cv" width="1280" height="720"></canvas><div style="position:absolute;right:14px;top:8px;font-size:34px;color:#fff;cursor:pointer;z-index:2;text-shadow:0 0 6px #000" onclick="stop()">✕</div></div>
<audio id="au" loop></audio>
<script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js"></script>
<script>
const W=1280,H=720,ZC=14,$=id=>document.getElementById(id),FF='"Gaegu","Nanum Pen Script","Malgun Gothic",cursive',COL=['#e53935','#1e88e5','#43a047','#fb8c00','#8e24aa','#00897b'],WD=['일','월','화','수','목','금','토'];
let items=[],places=[],map,mk=[],pl=[],coverUrl='',pick=null,tok=0,gA=null,MC=null,MM=null,dayF=-1,tripMap=new Map();
const raf=()=>new Promise(r=>requestAnimationFrame(r)),sleep=ms=>new Promise(r=>setTimeout(r,ms));
$('gk').value=localStorage.getItem('gmkey')||'';
const fmtT=t=>new Date(t).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false});
const dk=t=>{const d=new Date(t);return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()};
const dayLabel=(t,d)=>{const x=new Date(t);return `DAY ${d+1} · ${x.getMonth()+1}월 ${x.getDate()}일 (${WD[x.getDay()]})`};
const isMedia=f=>/^(image|video)\//.test(f.type)||/\.(jpe?g|png|heic|heif|webp|mp4|mov|3gp)$/i.test(f.name);
function dist(a,b){const R=6371000,r=Math.PI/180,dl=(b.lat-a.lat)*r,dn=(b.lng-a.lng)*r,x=Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function status(t){$('msg').textContent=t;if(!$('show').classList.contains('hide')){const c=$('cv').getContext('2d');c.fillStyle='#000';c.fillRect(0,0,W,H);c.fillStyle='#fff';c.font=`700 46px ${FF}`;c.textAlign='center';c.fillText(t,W/2,H/2)}}
/* ---------- 폴더/파일 ---------- */
function scanDir(){tripMap=new Map();for(const f of [...$('dir').files].filter(isMedia)){const p=(f.webkitRelativePath||f.name).split('/'),n=p.length>=3?p[1]:p[0];if(!tripMap.has(n))tripMap.set(n,[]);tripMap.get(n).push(f)}
 const s=$('trip');s.innerHTML='';[...tripMap].forEach(([n,a])=>s.add(new Option(`${n} (${a.length}개)`,n)));
 if(tripMap.size>1)s.add(new Option(`📦 전체 합치기 (${[...tripMap.values()].flat().length}개)`,'*'));
 s.classList.toggle('hide',!tripMap.size);if(tripMap.size){s.value=[...tripMap.keys()][0];pickTrip()}}
function pickTrip(){const v=$('trip').value;if(v&&v!='*')$('title').value=v}
async function vidGps(f){const rd=b=>new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);x.readAsBinaryString(b)});
 for(const b of [f.slice(0,3e6),f.slice(Math.max(0,f.size-3e6))]){const s=await rd(b),m=s.match(/\xA9xyz[\s\S]{0,6}?([+-]\d+\.\d+)([+-]\d+\.\d+)/);if(m)return[+m[1],+m[2]]}return null}
function loadG(key){return new Promise((res,rej)=>{if(window.google&&google.maps)return res();
 window.gm_authFailure=()=>{$('msg').textContent='⚠ 구글 지도 키 오류: Maps JavaScript API 사용 설정과 키 제한(웹사이트 주소)을 확인하세요.'};
 const s=document.createElement('script');s.src=`https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(key)}&language=ko&region=KR&callback=__g`;window.__g=res;s.onerror=rej;document.head.appendChild(s)})}
async function build(){
 const key=$('gk').value.trim();if(key)localStorage.setItem('gmkey',key);
 const v=$('trip').value,tf=tripMap.size?(v=='*'?[...tripMap.values()].flat():tripMap.get(v)||[]):[],seen=new Set(),
  fs=[...tf,...$('files').files,...$('files2').files].filter(f=>{const k=f.name+f.size+f.lastModified;if(seen.has(k))return false;seen.add(k);return isMedia(f)});
 if(!fs.length){alert('사진·영상을 선택하세요');return}
 $('setup').classList.add('hide');$('main').classList.remove('hide');status('사진 정보 읽는 중...');
 if($('cover').files[0])coverUrl=URL.createObjectURL($('cover').files[0]);
 if($('music').files[0])$('au').src=URL.createObjectURL($('music').files[0]);
 if(key){try{await loadG(key);map=new google.maps.Map($('map'),{center:{lat:36.5,lng:127.8},zoom:7,gestureHandling:'greedy',streetViewControl:false});map.addListener('click',onPick)}catch(_){status('구글 지도를 불러오지 못했습니다(인터넷/키 확인).')}}
 items=[];let n=0;
 for(const f of fs){const vd=f.type.startsWith('video')||/\.(mp4|mov|3gp)$/i.test(f.name),it={file:f,url:URL.createObjectURL(f),video:vd,t:f.lastModified,keep:true};
  const m=f.name.match(/(20\d\d)(\d\d)(\d\d)[_-]?(\d\d)(\d\d)(\d\d)/);if(m)it.t=+new Date(m[1],m[2]-1,m[3],m[4],m[5],m[6]);
  if(!vd){try{const g=await exifr.gps(f);if(g&&g.latitude!=null){it.lat=g.latitude;it.lng=g.longitude}}catch(_){}
   try{const e=await exifr.parse(f,['DateTimeOriginal','CreateDate','GPSAltitude']);if(e){const d=e.DateTimeOriginal||e.CreateDate;if(d)it.t=+new Date(d);if(e.GPSAltitude!=null)it.alt=e.GPSAltitude}}catch(_){}
   try{it.th=await createImageBitmap(f,{resizeWidth:100})}catch(_){}}
  else{try{const g=await vidGps(f);if(g){it.lat=g[0];it.lng=g[1]}}catch(_){}}
  if(it.lat!=null&&!(Math.abs(it.lat)<=90&&Math.abs(it.lng)<=180)){it.lat=undefined;it.lng=undefined}
  items.push(it);if(++n%10==0)status(`사진 정보 읽는 중 ${n}/${fs.length}`)}
 items.sort((a,b)=>a.t-b.t);places=[];let cur=null;
 for(const it of items){const gp=it.lat!=null,near=cur&&(gp?(cur.hasGps&&dist(cur,it)<400&&it.t-cur.last<4*36e5&&dk(it.t)==dk(cur.last)):(it.t-cur.last<5400000));
  if(!near){cur={lat:gp?it.lat:null,lng:gp?it.lng:null,items:[],name:gp?'장소':'위치 미상',ele:null,hasGps:gp};places.push(cur)}
  cur.items.push(it);it.place=cur;cur.last=it.t;if(gp&&!cur.hasGps){cur.hasGps=1;cur.lat=it.lat;cur.lng=it.lng}}
 places.forEach(p=>{const g=p.items.filter(x=>x.lat!=null);if(g.length){p.lat=g.reduce((s,x)=>s+x.lat,0)/g.length;p.lng=g.reduce((s,x)=>s+x.lng,0)/g.length}});
 render();hint();await names();hint()}
function hint(){const n=items.filter(x=>x.lat==null).length,g=items.length-n;
 $('msg').textContent=`위치정보 읽음 ${g}개 / 없음 ${n}개.`+(window._merr||'')+(n?` 위치 없는 파일은 시간순으로 묶었고 '위치 지정'으로 직접 지정할 수 있어요. 갤러리 선택은 위치를 지우니 '원본 파일로 선택'을 쓰세요.`:'')}
async function locate(p){
 try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&zoom=17&accept-language=ko&lat=${p.lat}&lon=${p.lng}`),d=await r.json(),a=d.address||{};
  p.name=d.name||a.tourism||a.natural||a.leisure||a.amenity||a.road||a.suburb||(d.display_name||'').split(',')[0]||'장소'}catch(_){}
 try{const r=await fetch(`https://api.open-meteo.com/v1/elevation?latitude=${p.lat}&longitude=${p.lng}`);p.ele=Math.round((await r.json()).elevation[0])}catch(_){
  const al=p.items.map(i=>i.alt).filter(x=>x!=null);if(al.length)p.ele=Math.round(al.reduce((a,b)=>a+b)/al.length)}}
async function names(){for(const p of places){if(p.lat==null||p.done)continue;p.done=1;await locate(p);render();await sleep(1100)}}
const isMt=p=>p.ele!=null&&(p.ele>=150||/산|봉|岳|산장/.test(p.name));
/* ---------- 여행 데이터 ---------- */
function trip(){const pl=places.map((p,i)=>({p,i,k:p.items.filter(x=>x.keep)})).filter(o=>o.k.length),days=[...new Set(pl.map(o=>dk(o.k[0].t)))].sort((a,b)=>a-b);
 pl.forEach(o=>{o.day=days.indexOf(dk(o.k[0].t));o.col=COL[o.day%COL.length];o.t=o.k[0].t;o.ni=o.k.filter(x=>!x.video).length;o.nv=o.k.length-o.ni});
 return{pl,days,loc:pl.filter(o=>o.p.lat!=null)}}
function meta(T){const k=items.filter(x=>x.keep),f=k.length?k[0].t:Date.now(),l=k.length?k[k.length-1].t:f,z=n=>String(n).padStart(2,'0'),a=new Date(f),b=new Date(l),nd=T.days.length||1,
 A=`${a.getFullYear()}.${z(a.getMonth()+1)}.${z(a.getDate())}`,B=`${b.getFullYear()!=a.getFullYear()?b.getFullYear()+'.':''}${z(b.getMonth()+1)}.${z(b.getDate())}`;
 return{title:$('title').value,range:dk(f)==dk(l)?A:A+' ~ '+B,dur:nd<2?'당일':`${nd-1}박 ${nd}일`,dep:$('dep').value.trim(),stay:$('stay').value.trim(),
  names:[...new Set(T.pl.map(o=>o.p.name).filter(n=>!/위치 미상|^장소$/.test(n)))],mates:$('mates').value.split(/[,，、]+/).map(s=>s.trim()).filter(Boolean)}}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function mkIcon(o){const i=o.i,im=o.k.filter(x=>!x.video),ths=im.slice(0,3).map(x=>x.th).filter(Boolean),p=o.p,
 w=Math.max(160,ths.length*52+12),hh=isMt(p)?104:84,cv=document.createElement('canvas');cv.width=w;cv.height=hh+16;const c=cv.getContext('2d');
 c.fillStyle='#fff';c.strokeStyle=o.col;c.lineWidth=3;rr(c,2,2,w-4,hh,10);c.fill();c.stroke();
 c.fillStyle=o.col;c.beginPath();c.moveTo(w/2-9,hh);c.lineTo(w/2,hh+14);c.lineTo(w/2+9,hh);c.closePath();c.fill();
 c.beginPath();c.arc(20,20,12,0,7);c.fill();c.fillStyle='#fff';c.font='bold 14px sans-serif';c.textAlign='center';c.fillText(String(i+1),20,25);
 c.fillStyle='#222';c.textAlign='left';c.font='bold 12px sans-serif';c.fillText(`${p.name.slice(0,7)} 사${o.ni}·영${o.nv}`,38,25);
 ths.forEach((b,k)=>{const s=Math.min(b.width,b.height);c.drawImage(b,(b.width-s)/2,(b.height-s)/2,s,s,8+k*52,34,48,48)});
 if(isMt(p)){c.fillStyle='#c62828';c.fillText(`⛰ 해발 ${p.ele}m`,8,hh-6)}
 return{url:cv.toDataURL(),scaledSize:new google.maps.Size(cv.width,cv.height),anchor:new google.maps.Point(w/2,hh+14)}}
function fitAll(){if(!map)return;const T=trip(),L=T.loc.filter(o=>dayF<0||o.day==dayF);if(!L.length)return;const b=new google.maps.LatLngBounds();L.forEach(o=>b.extend({lat:o.p.lat,lng:o.p.lng}));map.fitBounds(b,70)}
function setDay(d){dayF=d;render();fitAll()}
function drawMap(T){if(!map)return;window._merr='';
 try{mk.forEach(x=>x.setMap(null));mk=[];pl.forEach(x=>x.setMap(null));pl=[];
  for(let k=1;k<T.loc.length;k++){const a=T.loc[k-1],b=T.loc[k];if(dayF>=0&&b.day!=dayF)continue;const path=[a.p,b.p].map(p=>({lat:p.lat,lng:p.lng}));
   pl.push(new google.maps.Polyline({map,path,strokeColor:'#fff',strokeWeight:8,zIndex:1}));
   pl.push(new google.maps.Polyline({map,path,strokeColor:b.col,strokeWeight:4,zIndex:2,icons:[{icon:{path:google.maps.SymbolPath.FORWARD_CLOSED_ARROW,scale:3,strokeColor:b.col,fillColor:b.col,fillOpacity:1},offset:'50%'}]}))}
  T.loc.forEach(o=>{if(dayF>=0&&o.day!=dayF)return;let ic;try{ic=mkIcon(o)}catch(_){}
   const x=new google.maps.Marker({position:{lat:o.p.lat,lng:o.p.lng},map,icon:ic,label:ic?undefined:{text:String(o.i+1),color:'#fff'},title:o.p.name,zIndex:10+o.i});x.addListener('click',()=>openPlace(o.i));mk.push(x)});
  if(T.loc.length&&!map._fit){map._fit=1;fitAll();google.maps.event.addListenerOnce(map,'idle',()=>map.getZoom()>16&&map.setZoom(16))}
 }catch(e){window._merr=' ⚠ 지도 표시 오류: '+e.message}}
function render(){const T=trip(),m=meta(T);$('h').textContent='📖 '+m.title;
 $('sub').textContent=`${m.range} · ${m.dur} · 동반 ${m.mates.length}명${m.mates.length?'('+m.mates.join(', ')+')':''}${m.dep?' · 출발: '+m.dep:''} · 숙박: ${m.stay||'없음'}`;
 $('dayb').innerHTML=T.days.length>1?`<button class="g" onclick="setDay(-1)">전체</button>`+T.days.map((d,i)=>`<button style="background:${COL[i%6]}" onclick="setDay(${i})">DAY ${i+1}</button>`).join(''):'';
 drawMap(T);
 $('nl').innerHTML=places.map((p,i)=>p.lat==null?`<button class="g" onclick="openPlace(${i})">${i+1}. ${p.name} (${p.items.length}개) · 위치 지정</button>`:'').join('');
 let h='<tr><th style="width:70px">시간</th><th>장소</th><th>자료</th></tr>',d=-1;if(m.dep)h+=`<tr><td>출발</td><td colspan=2>${m.dep}</td></tr>`;
 T.pl.forEach(o=>{if(o.day!=d){d=o.day;h+=`<tr><td colspan=3 style="background:${o.col}22;font-weight:700">${dayLabel(o.t,o.day)}</td></tr>`}
  h+=`<tr><td>${fmtT(o.t)}</td><td>${o.i+1}. ${o.p.name}${isMt(o.p)?' ⛰ 해발 '+o.p.ele+'m':''}</td><td>${[o.ni?`사진 ${o.ni}장`:'',o.nv?`동영상 ${o.nv}개`:''].filter(Boolean).join(', ')}</td></tr>`});
 const last=items[items.length-1];if(last)h+=`<tr><td>${fmtT(last.t)}</td><td colspan=2>여행 종료 / 도착</td></tr>`;$('tb').innerHTML=h}
async function onPick(e){if(pick==null)return;const p=places[pick];pick=null;p.lat=e.latLng.lat();p.lng=e.latLng.lng();p.hasGps=1;p.done=1;
 p.items.forEach(x=>{x.lat=p.lat;x.lng=p.lng});status('장소 확인 중...');await locate(p);render();hint()}
function openPlace(i){const p=places[i];
 let h=`<h3>${i+1}. ${p.name} ${isMt(p)?'⛰ 해발 '+p.ele+'m':''}</h3><button onclick="pickLoc(${i})">📍 지도에서 위치 지정</button><button class="g" onclick="ren(${i})">✏️ 이름 변경</button><div class="gal" style="margin-top:8px">`;
 p.items.forEach((x,j)=>{h+=`<div class="${x.keep?'':'off'}">${x.video?`<video src="${x.url}" controls></video>`:`<img loading="lazy" src="${x.url}">`}<br>${fmtT(x.t)}<br><label style="display:inline"><input type="checkbox" style="width:auto" ${x.keep?'checked':''} onchange="tog(${i},${j},this.checked)"> 사용</label>
  <br><select onchange="mv(${i},${j},this.value)">${places.map((q,k)=>`<option value="${k}" ${k==i?'selected':''}>${k+1}. ${q.name}</option>`).join('')}</select></div>`});
 $('oin').innerHTML=h+'</div><button onclick="$(\'ov\').classList.add(\'hide\')">닫기</button>';$('ov').classList.remove('hide')}
function pickLoc(i){pick=i;$('ov').classList.add('hide');status('지도에서 이 장소의 위치를 탭하세요 (확대해서 정확히)');$('map').scrollIntoView()}
